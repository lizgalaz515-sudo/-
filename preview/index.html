<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7c5ce7" />
  <meta name="description" content="练记微信小程序交互预览，记录训练，看到每一次进步。" />
  <title>练记 · 健身训练记录</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%237c5ce7'/%3E%3Cpath d='M14 24v16m8-22v28m20-28v28m8-22v16M22 32h20' fill='none' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/preview/runtime.css" />
</head>
<body>
  <main id="app" aria-label="练记小程序交互预览"><div class="boot-state">练记 · 正在准备你的训练手账…</div></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="native-dialog" aria-labelledby="dialog-title">
    <h2 id="dialog-title"></h2><p id="dialog-content"></p>
    <textarea id="clipboard-fallback" readonly hidden aria-label="导出的训练备份"></textarea>
    <div class="dialog-actions"><button id="dialog-cancel" type="button">取消</button><button id="dialog-confirm" type="button">确定</button></div>
  </dialog>
  <script type="module" src="/preview/runtime.mjs"></script>
</body>
</html>
